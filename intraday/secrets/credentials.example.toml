# Copy this file to `credentials.toml` (gitignored, chmod 600) and fill in
# real values. Never commit the real file.
#
# kite-auth (M2) uses these to drive Kite's headless login + TOTP flow each
# morning and mint a fresh access token with no manual step.

[kite]
api_key = ""
api_secret = ""
user_id = ""       # Zerodha client id, e.g. "AB1234"
password = ""
totp_secret = ""   # base32 TOTP seed from Kite's 2FA setup (not a 6-digit code)
