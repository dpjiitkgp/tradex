# Live config for the real-money VWAP-slope short book.
#
# 2026-09-29: rebuilt from the walk-forward study. Two changes from the
# previous version, both evidenced in research/stock-selection/:
#
#  1. SELECTION is now mechanical and periodic: top 25 by Avg R over the
#     trailing 2 years, win% >= 48, re-ranked QUARTERLY. The previous book
#     was 15 names picked once on ~8 years and never refreshed - the
#     worst-performing setup in every sweep.
#
#     The Rs2M/min traded-value floor the ranking comments mention was
#     NOT applied: it costs ~0.02 R up front and its benefit is capacity,
#     not edge. The per-stock Rs/min figures below are recorded for
#     reference only; nothing enforces them.
#
#  2. PER-STOCK TUNING IS GONE. Every stock now runs the same
#     (lookback 20, MRM 3.0, trail 0.75%). Walk-forward over 482
#     stock-quarters found per-stock tuning worth exactly 0.0000 R
#     (t = 0.00): it changed which config was used 482 times and made no
#     measurable difference. Each stock has ~75 trades per training
#     window against sigma 1.4 R, far too few to choose between 12
#     configs, so the old +19% gain was selection noise.
#
# The exit config itself is unchanged and was re-confirmed: MRM 1.5 is
# significantly worse (t = 2.03), MRM 6.0 and a 0.25% trail are both
# within noise or slightly worse under walk-forward.
#
# NEXT REBALANCE: 2027Q1. Re-run
#   python3 research/stock-analysis/detail_report.py --lookback 8 \
#     --unit quarter --topn 25 --min-turnover 2000000 \
#     --data research/long-baseline/analysis/short_quarterly_110.tsv
# and take the basket it selects on data through 2026Q4.
#
# EXPECTATION — corrected 2026-10-01, read this before trusting any older
# number in this repo.
#
# Every figure produced before 2026-09-30 assumed a 15:15 square-off, which
# Zerodha does not permit (MIS orders are refused from 15:12). Re-measured at
# the achievable 15:10, this book's backtest is:
#
#   24m window, 2020Q4..2026Q3   +0.0133 net R/trade   (~Rs12,400/yr on Rs1L)
#   the same, 2021Q1 onward      +0.0002 net R/trade   (~zero)
#
# The five minutes were worth -0.0426 R/trade, about 76% of the measured
# edge, and what remains is one post-COVID quarter. See
# research/stock-selection/square-off-1515-vs-1510.md and
# research/stock-selection/window-length-matched.md.
#
# Those numbers are also GROSS of market impact (~0.06 R round trip at
# median size) and assume a 97.9% fill rate the live engine has not achieved.
# Treat this book as unproven rather than as a Rs37,000/yr expectation.

